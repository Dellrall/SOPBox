name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r src/backend/requirements-dev.txt
      # Starts an embedded PostgreSQL itself: no service container needed.
      - run: python -m pytest -q
